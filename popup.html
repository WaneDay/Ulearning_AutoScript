<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>优学院好舒服呀</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 300px;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #fafafa;
            color: #2d3436;
        }
        .head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #ff7e67, #ea5947);
            color: #fff;
        }
        .head img { width: 26px; height: 26px; border-radius: 6px; }
        .head h1 { font-size: 15px; font-weight: 700; }
        .head p { font-size: 11px; opacity: 0.85; }
        .body { padding: 14px 16px 16px; }
        .row { display: flex; flex-direction: column; gap: 8px; }
        button {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.15s ease;
        }
        button:hover { filter: brightness(0.96); }
        .btn-primary { background: #ea5947; color: #fff; }
        .btn-ghost { background: #fff; color: #2d3436; border: 1px solid #e4e4ea; }
        .hint { margin-top: 12px; font-size: 11px; color: #8a8a93; line-height: 1.6; }
        #status { margin-top: 10px; font-size: 12px; color: #16a085; min-height: 16px; }
    </style>
</head>
<body>
    <div class="head">
        <img src="icons/icon.png" alt="">
        <div>
            <h1>优学院好舒服呀</h1>
            <p>自动播放 · 自动作答 · 自动翻页</p>
        </div>
    </div>
    <div class="body">
        <div class="row">
            <button id="openSite" class="btn-primary">打开优学院</button>
            <button id="reloadContent" class="btn-ghost">重新加载内容脚本</button>
        </div>
        <div id="status"></div>
        <div class="hint">
            在优学院课程页面会自动注入悬浮球与操作面板。<br>
            若页面没有悬浮球，点「重新加载内容脚本」即可。
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
